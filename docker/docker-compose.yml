version: '2.2'

networks:
  cat:
    driver: bridge

services:
  cat:
    image: cat:4.0-RC1-jdk21
    container_name: cat
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    environment:
      # If you have your own MySQL, configure it here and disable the mysql service below.
      - MYSQL_URL=cat-mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=root
      - MYSQL_PASSWD=
      - MYSQL_SCHEMA=cat
      # 必须设置成你的机器 IP 地址
      # - SERVER_IP=YOUR IP
    volumes:
      # 默认 127.0.0.1，可以修改为真实的服务器集群地址
      - "./client.xml:/data/appdatas/cat/client.xml"
      # 默认使用环境变量设置。也可以启用本注释，并修改为自己的配置
#      - "./datasources.xml:/data/appdatas/cat/datasources.xml"
    command: /bin/sh -c './datasources.sh && java -Dcat.home=/data/appdatas/cat -Dserver.port=8080 -jar /app/cat-boot.jar'
    links:
      - mysql
    depends_on:
      - mysql
    ports:
      - "8080:8080"
      - "2280:2280"
    networks:
      - cat

  # Disable this if you have your own MySQL.
  mysql:
    container_name: cat-mysql
    image: mysql:5.7.37
    # Expose 3306 to clients such as Navicat.
    ports:
      - 3306:3306
    volumes:
      # Change './docker/mysql/volume' to your own path.
      # WARNING: without this line, your data will be lost.
      - "./mysql/volume:/var/lib/mysql"
      - "../script/:/docker-entrypoint-initdb.d/"
    command: mysqld -uroot --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4;' --innodb-flush-log-at-trx-commit=0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: "cat"
      MYSQL_PASSWORD: ""
    networks:
      - cat
