apiVersion: v1
kind: ConfigMap
metadata:
  name: cat-mysql-script
  namespace: {{ .Release.Namespace }}
data:
  CatApplication.sql: |
    CREATE TABLE `dailyreport` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `name` varchar(20) NOT NULL COMMENT '报表名称, transaction, problem...',
      `ip` varchar(50) NOT NULL COMMENT '报表来自于哪台cat-consumer机器',
      `domain` varchar(50) NOT NULL COMMENT '报表处理的Domain信息',
      `period` datetime NOT NULL  COMMENT '报表时间段',
      `type` tinyint(4) NOT NULL COMMENT '报表数据格式, 1/xml, 2/json, 默认1',
      `creation_date` datetime NOT NULL COMMENT '报表创建时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `period` (`period`,`domain`,`name`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COMMENT='天报表';

    CREATE TABLE `weeklyreport` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `name` varchar(20) NOT NULL COMMENT '报表名称, transaction, problem...',
      `ip` varchar(50) NOT NULL COMMENT '报表来自于哪台cat-consumer机器',
      `domain` varchar(50) NOT NULL COMMENT '报表处理的Domain信息',
      `period` datetime NOT NULL  COMMENT '报表时间段',
      `type` tinyint(4) NOT NULL COMMENT '报表数据格式, 1/xml, 2/json, 默认1',
      `creation_date` datetime NOT NULL COMMENT '报表创建时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `period` (`period`,`domain`,`name`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COMMENT='周报表';

    CREATE TABLE `monthreport` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `name` varchar(20) NOT NULL COMMENT '报表名称, transaction, problem...',
      `ip` varchar(50) NOT NULL COMMENT '报表来自于哪台cat-consumer机器',
      `domain` varchar(50) NOT NULL COMMENT '报表处理的Domain信息',
      `period` datetime NOT NULL  COMMENT '报表时间段',
      `type` tinyint(4) NOT NULL COMMENT '报表数据格式, 1/xml, 2/json, 默认1',
      `creation_date` datetime NOT NULL COMMENT '报表创建时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `period` (`period`,`domain`,`name`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COMMENT='月报表';

    CREATE TABLE `hostinfo` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `ip` varchar(50) NOT NULL COMMENT '部署机器IP',
      `domain` varchar(200) NOT NULL COMMENT '部署机器对应的项目名',
      `hostname` varchar(200) DEFAULT NULL COMMENT '机器域名',
      `creation_date` datetime NOT NULL,
      `last_modified_date` datetime NOT NULL,
      PRIMARY KEY (`id`),
      UNIQUE KEY `ip_index` (`ip`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COMMENT='IP和项目名的对应关系';

    CREATE TABLE `hourlyreport` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `type` tinyint(4) NOT NULL COMMENT '报表类型, 1/xml, 9/binary 默认1',
      `name` varchar(20) NOT NULL COMMENT '报表名称',
      `ip` varchar(50) DEFAULT NULL COMMENT '报表来自于哪台机器',
      `domain` varchar(50) NOT NULL  COMMENT '报表项目',
      `period` datetime NOT NULL COMMENT '报表时间段',
      `creation_date` datetime NOT NULL COMMENT '报表创建时间',
      PRIMARY KEY (`id`),
      KEY `IX_Domain_Name_Period` (`domain`,`name`,`period`),
      KEY `IX_Name_Period` (`name`,`period`),
      KEY `IX_Period` (`period`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=COMPRESSED COMMENT='用于存放实时报表信息，处理之后的结果';

    CREATE TABLE `hourly_report_content` (
      `report_id` int(11) NOT NULL COMMENT '报表ID',
      `content` longblob NOT NULL COMMENT '二进制报表内容',
      `period` datetime NOT NULL  COMMENT '报表时间段',
      `creation_date` datetime NOT NULL COMMENT '创建时间',
      PRIMARY KEY (`report_id`),
      KEY `IX_Period` (`period`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=COMPRESSED COMMENT='小时报表二进制内容';

    CREATE TABLE `daily_report_content` (
      `report_id` int(11) NOT NULL COMMENT '报表ID',
      `content` longblob NOT NULL COMMENT '二进制报表内容',
      `period` datetime  COMMENT '报表时间段',
      `creation_date` datetime NOT NULL COMMENT '创建时间',
      PRIMARY KEY (`report_id`),
      KEY `IX_Period` (`period`)
    )ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=COMPRESSED COMMENT='天报表二进制内容';

    CREATE TABLE `weekly_report_content` (
      `report_id` int(11) NOT NULL COMMENT '报表ID',
      `content` longblob NOT NULL COMMENT '二进制报表内容',
      `period` datetime  COMMENT '报表时间段',
      `creation_date` datetime NOT NULL COMMENT '创建时间',
      PRIMARY KEY (`report_id`),
      KEY `IX_Period` (`period`)
    )ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=COMPRESSED COMMENT='周报表二进制内容';

    CREATE TABLE `monthly_report_content` (
      `report_id` int(11) NOT NULL COMMENT '报表ID',
      `content` longblob NOT NULL COMMENT '二进制报表内容',
      `period` datetime  COMMENT '报表时间段',
      `creation_date` datetime NOT NULL COMMENT '创建时间',
      PRIMARY KEY (`report_id`),
      KEY `IX_Period` (`period`)
    )ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=COMPRESSED COMMENT='月报表二进制内容';

    CREATE TABLE `t_business_report`
    (
        `id`           bigint      NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `type`         tinyint(4)  NOT NULL DEFAULT '1' COMMENT '报表数据格式, 1/binary, 2/xml, 3/json',
        `name`         varchar(20) NOT NULL DEFAULT '' COMMENT '报表名称',
        `ip`           varchar(50) NOT NULL DEFAULT '' COMMENT '报表来源机器IP',
        `product_line` varchar(50) NOT NULL DEFAULT '' COMMENT '业务指标来源产品线',
        `period`       datetime    NOT NULL DEFAULT '1970-01-01 00:00:00' COMMENT '报表时间段',
        `content`      longblob    NOT NULL COMMENT '业务报表内容',
        `create_time`  datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time`  datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        KEY `idx_period_product_line_name` (`period`,`product_line`,`name`),
        KEY `idx_product_line_name_period` (`product_line`,`name`,`period`),
        KEY `idx_period` (`period`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 ROW_FORMAT=COMPRESSED COMMENT='业务监控实时报表';


    CREATE TABLE `t_task`
    (
        `id`            bigint      NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `producer`      varchar(50) NOT NULL DEFAULT '' COMMENT '任务创建机器IP',
        `consumer`      varchar(50) NOT NULL DEFAULT '' COMMENT '任务执行机器IP',
        `failure_count` int         NOT NULL DEFAULT '0' COMMENT '任务失败次数',
        `report_name`   varchar(20) NOT NULL DEFAULT '' COMMENT '报表名称, transaction, problem...',
        `report_domain` varchar(50) NOT NULL DEFAULT '' COMMENT '报表所属Domain',
        `report_period` datetime    NOT NULL DEFAULT '1970-01-01 00:00:00' COMMENT '报表时间',
        `status`        tinyint(4)  NOT NULL DEFAULT '1' COMMENT '执行状态, 1/todo, 2/doing, 3/done, 4/failed',
        `task_type`     tinyint(4)  NOT NULL DEFAULT '1' COMMENT '任务类型, 0/hourly, 1/daily',
        `create_time`   datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `start_time`    datetime    NOT NULL DEFAULT '1970-01-01 00:00:00' COMMENT '执行开始时间',
        `end_time`      datetime    NOT NULL DEFAULT '1970-01-01 00:00:00' COMMENT '执行结束时间',
        `update_time`   datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        UNIQUE KEY `uk_report_period_domain_name_type` (`report_period`,`report_domain`,`report_name`,`task_type`),
        KEY `idx_status_consumer` (`status`,`consumer`),
        KEY `idx_report_period` (`report_period`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='后台任务';


    CREATE TABLE `t_project`
    (
        `id`                bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `domain`            varchar(200) NOT NULL DEFAULT '' COMMENT '项目名称',
        `cmdb_domain`       varchar(200) NOT NULL DEFAULT '' COMMENT 'CMDB项目名称',
        `level`             int          NOT NULL DEFAULT '0' COMMENT '项目级别',
        `bu`                varchar(50)  NOT NULL DEFAULT '' COMMENT 'CMDB事业部',
        `cmdb_product_line` varchar(50)  NOT NULL DEFAULT '' COMMENT 'CMDB产品线',
        `owner`             varchar(50)  NOT NULL DEFAULT '' COMMENT '项目负责人',
        `email`             text         NOT NULL COMMENT '项目组邮箱',
        `phone`             text         NOT NULL COMMENT '联系电话',
        `create_time`       datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time`       datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        UNIQUE KEY `uk_domain` (`domain`),
        KEY `idx_cmdb_domain` (`cmdb_domain`),
        KEY `idx_cmdb_product_line` (`cmdb_product_line`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='项目基础信息';


    CREATE TABLE `t_topology_graph`
    (
        `id`          bigint      NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `ip`          varchar(50) NOT NULL DEFAULT '' COMMENT '生成拓扑图的机器IP',
        `period`      datetime    NOT NULL DEFAULT '1970-01-01 00:00:00' COMMENT '拓扑图时间段, 精确到分钟',
        `type`        tinyint(4)  NOT NULL DEFAULT '3' COMMENT '数据格式, 1/xml, 2/json, 3/binary',
        `content`     longblob    NOT NULL COMMENT '拓扑图内容',
        `create_time` datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time` datetime    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        KEY `idx_period` (`period`),
        KEY `idx_ip_period` (`ip`,`period`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 ROW_FORMAT=COMPRESSED COMMENT='历史拓扑图';


    CREATE TABLE `t_config`
    (
        `id`          bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `name`        varchar(100) NOT NULL DEFAULT '' COMMENT '配置名称',
        `content`     longtext     NOT NULL COMMENT '配置内容',
        `create_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        UNIQUE KEY `uk_name` (`name`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='系统全局配置';

    CREATE TABLE `t_baseline`
    (
        `id`            bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `report_name`   varchar(100) NOT NULL DEFAULT '' COMMENT '报表名称',
        `index_key`     varchar(255) NOT NULL DEFAULT '' COMMENT '指标Key',
        `report_period` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '报表时间',
        `data`          blob         NOT NULL COMMENT '基线数据',
        `create_time`   datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time`   datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        UNIQUE KEY `uk_period_name_key` (`report_period`, `report_name`, `index_key`),
        KEY `idx_report_name` (`report_name`),
        KEY `idx_index_key` (`index_key`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='指标基线数据';

    CREATE TABLE `t_alteration`
    (
        `id`          bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `type`        varchar(64)  NOT NULL DEFAULT '' COMMENT '变更分类',
        `title`       varchar(128) NOT NULL DEFAULT '' COMMENT '变更标题',
        `domain`      varchar(128) NOT NULL DEFAULT '' COMMENT '变更项目',
        `hostname`    varchar(128) NOT NULL DEFAULT '' COMMENT '变更机器名',
        `ip`          varchar(128) NOT NULL DEFAULT '' COMMENT '变更机器IP',
        `change_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '变更时间',
        `user`        varchar(64)  NOT NULL DEFAULT '' COMMENT '变更用户',
        `alt_group`   varchar(64)  NOT NULL DEFAULT '' COMMENT '变更组别',
        `content`     longtext     NOT NULL COMMENT '变更内容',
        `url`         varchar(512) NOT NULL DEFAULT '' COMMENT '变更链接',
        `status`      tinyint      NOT NULL DEFAULT '0' COMMENT '变更状态',
        `create_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        KEY `ind_date_domain_host` (`change_time`, `domain`, `hostname`),
        KEY `idx_type_change_time` (`type`, `change_time`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='变更记录';

    CREATE TABLE `t_alert`
    (
        `id`          bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `domain`      varchar(128) NOT NULL DEFAULT '' COMMENT '告警项目',
        `alert_time`  datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '告警时间',
        `category`    varchar(64)  NOT NULL DEFAULT '' COMMENT '告警分类',
        `type`        varchar(64)  NOT NULL DEFAULT '' COMMENT '告警类型',
        `content`     longtext     NOT NULL COMMENT '告警内容',
        `metric`      varchar(256) NOT NULL DEFAULT '' COMMENT '告警指标',
        `create_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        KEY `idx_alert_time_category_domain` (`alert_time`, `category`, `domain`),
        KEY `idx_domain_alert_time` (`domain`, `alert_time`),
        KEY `idx_category_alert_time` (`category`, `alert_time`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='告警记录';

    CREATE TABLE `t_alert_summary`
    (
        `id`          bigint       NOT NULL AUTO_INCREMENT COMMENT '主键ID',
        `domain`      varchar(128) NOT NULL DEFAULT '' COMMENT '告警项目',
        `alert_time`  datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '告警时间',
        `content`     longtext     NOT NULL COMMENT '统一告警内容',
        `create_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `update_time` datetime     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        PRIMARY KEY (`id`),
        KEY `idx_alert_time_domain` (`alert_time`, `domain`),
        KEY `idx_domain_alert_time` (`domain`, `alert_time`),
        KEY `idx_create_time` (`create_time`),
        KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='统一告警信息';

    CREATE TABLE `t_operation` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `user` varchar(128) NOT NULL DEFAULT '' COMMENT '用户名',
      `module` varchar(128) NOT NULL DEFAULT '' COMMENT '模块',
      `operation` varchar(128) NOT NULL DEFAULT '' COMMENT '操作',
      `operation_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '操作时间',
      `content` longtext NOT NULL COMMENT '操作内容',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      KEY `idx_operation_time` (`operation_time`),
      KEY `idx_user_operation_time` (`user`, `operation_time`),
      KEY `idx_module_operation_time` (`module`, `operation_time`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='用户操作日志';

    CREATE TABLE `t_overload` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `report_id` bigint NOT NULL DEFAULT '0' COMMENT '报表ID',
      `report_type` tinyint NOT NULL DEFAULT '0' COMMENT '报表类型 1=hourly 2=daily 3=weekly 4=monthly',
      `report_size` double NOT NULL DEFAULT '0' COMMENT '报表大小，单位MB',
      `period` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '报表时间',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      KEY `idx_period` (`period`),
      KEY `idx_report_type_report_id` (`report_type`, `report_id`),
      KEY `idx_period_report_type` (`period`, `report_type`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='过大容量报表';

    CREATE TABLE `t_config_modification` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `user_name` varchar(64) NOT NULL DEFAULT '' COMMENT '用户名',
      `account_name` varchar(64) NOT NULL DEFAULT '' COMMENT '账号名',
      `action_name` varchar(64) NOT NULL DEFAULT '' COMMENT '操作名称',
      `argument` longtext NOT NULL COMMENT '参数内容',
      `modify_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '修改时间',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      KEY `idx_modify_time` (`modify_time`),
      KEY `idx_user_modify_time` (`user_name`, `modify_time`),
      KEY `idx_account_modify_time` (`account_name`, `modify_time`),
      KEY `idx_action_modify_time` (`action_name`, `modify_time`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='配置修改记录';

    CREATE TABLE `t_user_define_rule` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `content` text NOT NULL COMMENT '用户自定义规则',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='用户自定义规则';

    CREATE TABLE `t_business_config` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `name` varchar(64) NOT NULL DEFAULT '' COMMENT '配置名称',
      `domain` varchar(128) NOT NULL DEFAULT '' COMMENT '项目',
      `content` longtext NOT NULL COMMENT '配置内容',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_name_domain` (`name`, `domain`),
      KEY `idx_name` (`name`),
      KEY `idx_domain` (`domain`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='业务配置';

    CREATE TABLE `t_metric_screen` (
      `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `name` varchar(64) NOT NULL DEFAULT '' COMMENT '配置名称',
      `graph_name` varchar(64) NOT NULL DEFAULT '' COMMENT 'Graph名称',
      `view` varchar(64) NOT NULL DEFAULT '' COMMENT '视角',
      `end_points` longtext NOT NULL COMMENT '端点配置',
      `measurements` longtext NOT NULL COMMENT '指标配置',
      `content` longtext NOT NULL COMMENT '配置内容',
      `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_name_graph` (`name`, `graph_name`),
      KEY `idx_name` (`name`),
      KEY `idx_graph_name` (`graph_name`),
      KEY `idx_create_time` (`create_time`),
      KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='系统监控Screen配置';

    CREATE TABLE `t_metric_graph` (
          `id` bigint NOT NULL AUTO_INCREMENT COMMENT '主键ID',
          `graph_id` bigint NOT NULL DEFAULT '0' COMMENT '大盘ID',
          `name` varchar(64) NOT NULL DEFAULT '' COMMENT '配置ID',
          `content` longtext NOT NULL COMMENT '配置内容',
          `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
          `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
          PRIMARY KEY (`id`),
          UNIQUE KEY `uk_name` (`name`),
          KEY `idx_graph_id` (`graph_id`),
          KEY `idx_create_time` (`create_time`),
          KEY `idx_update_time` (`update_time`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='系统监控Graph配置';

    CREATE TABLE `server_alarm_rule` (
          `id` int(11) NOT NULL AUTO_INCREMENT,
          `category` varchar(50) NOT NULL COMMENT '监控分类',
          `endPoint` varchar(200) NOT NULL COMMENT '监控对象ID',
          `measurement` varchar(200) NOT NULL COMMENT '监控指标',
          `tags` varchar(200) NOT NULL DEFAULT '' COMMENT '监控指标标签',
          `content` longtext NOT NULL COMMENT '配置的具体内容',
          `type` varchar(20) NOT NULL DEFAULT '' COMMENT '数据聚合方式',
          `creator` varchar(100) DEFAULT '' COMMENT '创建人',
          `creation_date` datetime NOT NULL COMMENT '配置创建时间',
          `updatetime` datetime NOT NULL COMMENT '配置修改时间',
          PRIMARY KEY (`id`),
          KEY `updatetime` (`updatetime`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COMMENT='系统告警的配置';
